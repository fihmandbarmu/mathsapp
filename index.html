<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🌟 Math Adventure! 🌟</h1>
        
        <div class="stats">
            <div id="level-display">Level: 1</div>
            <div id="stars-display">Stars: 0 / 100 🌟</div>
        </div>

        <div id="question-box">
            <div class="math-column">
                <div id="num1">245</div>
                <div class="row-two">
                    <span id="operator">+</span> 
                    <span id="num2">182</span>
                </div>
            </div>
            <div class="question-mark">?</div>
        </div>

        <div id="message">Choose the right answer!</div>

        <div class="options">
            <button class="answer-btn" onclick="checkAnswer(this)">427</button>
            <button class="answer-btn" onclick="checkAnswer(this)">417</button>
            <button class="answer-btn" onclick="checkAnswer(this)">437</button>
        </div>

        <div id="winner-screen" class="hidden">
            <h2>🎉 YOU WON! 🎉</h2>
            <p>You beat Level 85,373! You are the ultimate Math Master!</p>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
